<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MonkeyMoji Test</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; }
        #info { position: absolute; top: 10px; left: 10px; color: #fff; font-family: sans-serif; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; z-index: 10; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "/node_modules/three/build/three.module.js",
            "three/addons/": "/node_modules/three/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info">Loading MonkeyMoji...</div>
    <canvas id="canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';

        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambient = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 30);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffeedd, 0.8);
        fillLight.position.set(-15, -10, 20);
        scene.add(fillLight);

        const loader = new ColladaLoader();
        const info = document.getElementById('info');

        loader.load('/assets/monkey/monkey_clean.dae', (collada) => {
            const avatar = collada.scene;
            scene.add(avatar);
            console.log('Collada loaded successfully!', avatar);

            // Find morph targets
            let morphCount = 0;
            let morphNames = [];
            avatar.traverse((child) => {
                if (child.isMesh && child.morphTargetDictionary) {
                    const keys = Object.keys(child.morphTargetDictionary);
                    morphCount += keys.length;
                    morphNames.push({ mesh: child.name, morphs: keys });
                    console.log('Mesh with morph targets:', child.name, keys);
                }
            });

            // Center and scale avatar
            const box = new THREE.Box3().setFromObject(avatar);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            console.log('Bounding box:', size, center);
            avatar.position.sub(center);

            info.innerHTML = `<b>MonkeyMoji Loaded!</b><br>Size: ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}<br>Morph targets found: ${morphCount}<br><small>Check console for mesh details</small>`;
            window._avatarLoaded = true;
            window._avatar = avatar;
            window._morphNames = morphNames;
        }, (xhr) => {
            info.innerText = `Loading: ${Math.round(xhr.loaded / xhr.total * 100)}%`;
        }, (error) => {
            console.error('Error loading collada:', error);
            info.innerText = `Error: ${error.message || error}`;
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
